#!/bin/bash
# ============================================================================
# imgctl Configuration File
# ============================================================================
# Copy this file to /etc/imgctl/imgctl.conf and modify as needed.
#
# Author: Anubhav Patrick <anubhav.patrick@giindia.com>
# Date: 2025-11-28
# ============================================================================

# ----------------------------------------------------------------------------
# CLUSTER CONFIGURATION
# ----------------------------------------------------------------------------

CLUSTER_NAME="dgx-cluster"

# Worker nodes - space-separated list
WORKER_NODES="k8s-worker1 k8s-worker2"

# SSH settings
SSH_USER="root"
SSH_OPTIONS="-o BatchMode=yes -o StrictHostKeyChecking=no -o ConnectTimeout=10"
SSH_KEY=""

# ----------------------------------------------------------------------------
# HARBOR REGISTRY CONFIGURATION
# ----------------------------------------------------------------------------

HARBOR_URL="https://bcm11-headnode:9443"
HARBOR_USER="testing"
HARBOR_PASSWORD="Test@123"
HARBOR_VERIFY_SSL="false"
HARBOR_PAGE_SIZE="100"

# ----------------------------------------------------------------------------
# IMAGE FILTERING
# ----------------------------------------------------------------------------

# Path to CSV file containing images to ignore
# Format: IMAGE,TAG,IMAGE ID,SIZE (header required)
# Images matching IMAGE,TAG will be excluded from node image output
IGNORE_FILE="/etc/imgctl/images_to_ignore.txt"

# Images without tags (<none>) are always filtered out automatically

# ----------------------------------------------------------------------------
# PARALLEL PROCESSING
# ----------------------------------------------------------------------------

MAX_PARALLEL_JOBS="10"

# ----------------------------------------------------------------------------
# CRICTL CONFIGURATION
# ----------------------------------------------------------------------------

CRICTL_PATH="/usr/bin/crictl"
CRICTL_TIMEOUT="30"

# ----------------------------------------------------------------------------
# LOGGING CONFIGURATION
# ----------------------------------------------------------------------------

LOG_DIR="/var/log/giindia/imgctl"
LOG_LEVEL="INFO"
LOG_RETENTION_DAYS="30"
MAX_LOG_SIZE="104857600"  # Maximum log file size in bytes (100MB)

# ----------------------------------------------------------------------------
# OUTPUT CONFIGURATION
# ----------------------------------------------------------------------------

DEFAULT_OUTPUT_FORMAT="table"

# ----------------------------------------------------------------------------
# CACHE CONFIGURATION
# ----------------------------------------------------------------------------

ENABLE_CACHE="true"
#CACHE_DIR="/tmp/imgctl-cache"
CACHE_DIR="/var/cache/imgctl"
CACHE_TTL="300"

# ----------------------------------------------------------------------------
# WEB GUI ("Cluster Image Portal")  -- optional; used by the imgcatalog units
# ----------------------------------------------------------------------------
# A small read-only web portal + JSON API that lists these images in a browser
# so Run:ai users can copy a pull reference without SSH. See docs/WEB_UI.md.
# Nothing institute/hardware-specific is hardcoded in the app -- the display
# text below is what users see in the header/badges. All keys are optional;
# the server falls back to sensible generic defaults if they are absent.

# Listener (the firewall port must be opened MANUALLY by an admin -- see README)
WEB_PORT="8088"
WEB_BIND_ADDRESS="0.0.0.0"          # 0.0.0.0 = reachable remotely via the public IP

# How often the snapshot refreshes is set by imgcatalog-refresh.timer (5 min).
WEB_SNAPSHOT_PATH="/var/lib/imgcatalog/all.json"
WEB_STALE_AFTER="900"               # seconds before the UI flags data as stale

# Registry host prepended to custom/Harbor image pull references
# (NGC/Docker node images already carry their host). Blank => derived from HARBOR_URL.
WEB_HARBOR_REGISTRY_HOST=""

# Header + badge display text (purely cosmetic; safe to change per site)
WEB_SITE_TITLE="Cluster Image Portal"
WEB_SITE_SUBTITLE=""                # blank => falls back to CLUSTER_NAME
WEB_LABEL_HARBOR="Harbor"           # label for private-registry images
WEB_LABEL_NODE="Node"               # label for worker-cached images (e.g. "DGX cache")
